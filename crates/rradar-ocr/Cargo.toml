[package]
name = "rradar-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ReceiptRadar OCR engine trait and backends (mock first; ONNX later)"
repository.workspace = true

[features]
default = ["mock"]
mock = []
## Real ONNX RapidOCR path (paddle-ocr-rs + ort load-dynamic).
## Build: `cargo build -p rradar-cli --features onnx`
## Runtime needs ONNX Runtime shared lib (see models/README.md) + weights under models/.
onnx = ["dep:paddle-ocr-rs", "dep:image", "dep:ort"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Inference stack is optional; CI stays mock-only.
paddle-ocr-rs = { version = "0.6.1", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
# Must match paddle-ocr-rs's ort pin (rc.10 API). load-dynamic: works on windows-gnu.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }

[dev-dependencies]
