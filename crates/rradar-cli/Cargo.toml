[package]
name = "rradar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ReceiptRadar CLI (rradar) — process receipts locally"
repository.workspace = true

[[bin]]
name = "rradar"
path = "src/main.rs"

[features]
default = []
## Link real ONNX RapidOCR (paddle-ocr-rs + ORT load-dynamic).
## Example: cargo run -p rradar-cli --features onnx -- process photo.jpg --engine onnx
onnx = ["rradar-ocr/onnx"]

[dependencies]
rradar-core = { workspace = true }
rradar-ocr = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
