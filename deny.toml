# cargo-deny configuration — dual gate with tools/supply-chain/check_deps.py
# Policy: Apache-2.0 project; forbid AGPL/SSPL/BUSL-class licenses; crates.io only.
# Docs: docs/SUPPLY-CHAIN.md

[graph]
# Default mock CLI graph (no --all-features). ONNX optional deps are out-of-band.
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
# Unmaintained is noisy for transitive crates; track via rustsec as needed.
unmaintained = "workspace"
# Network: cargo-deny may fetch advisory DB; CI should allow or use --offline after cache.
# Local offline: cargo deny check --offline  (after first online populate)

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "MIT-0",
]
# Dual-licensed packages are OK when any allow entry matches.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Workspace should not pull openssl into default (non-onnx) path.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
