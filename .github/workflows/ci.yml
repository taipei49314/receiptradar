name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: ffi surface
        run: cargo test -p rradar-ffi --locked

      - name: cli smoke
        run: |
          cargo run -p rradar-cli --locked -- version
          cargo run -p rradar-cli --locked -- version --long
          cargo run -p rradar-cli --locked -- process fixtures/text/familymart_89.txt
          cargo run -p bench-ocr --locked -- fixtures/text

      - name: demo closed-loop
        run: cargo run -p rradar-cli --locked -- demo --fixtures fixtures --db target/ci-demo/ledger.db --quiet

      - name: release binary smoke
        run: |
          cargo build --release -p rradar-cli --locked
          ./target/release/rradar version --long
          ./target/release/rradar demo --fixtures fixtures --db target/ci-release-demo/ledger.db --quiet
        shell: bash

      - name: network audit
        run: python tools/network-audit/check_offline_deps.py
