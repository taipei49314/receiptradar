name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: Dump measure report on failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, tempfile, pathlib
          root = pathlib.Path(tempfile.gettempdir())
          for p in glob.glob(str(root / "rradar-measure-*" / "measure-report.json")):
              print("==", p)
              print(pathlib.Path(p).read_text(encoding="utf-8"))
          PY

      - name: ffi surface
        run: cargo test -p rradar-ffi --locked

      - name: cli smoke
        run: |
          cargo run -p rradar-cli --locked -- version
          cargo run -p rradar-cli --locked -- version --long
          cargo run -p rradar-cli --locked -- version --json
          cargo run -p rradar-cli --locked -- engines
          cargo run -p rradar-cli --locked -- process fixtures/text/familymart_89.txt
          cargo run -p bench-ocr --locked -- fixtures/text

      - name: soft-delete trash smoke
        shell: bash
        run: |
          set -euo pipefail
          DB=target/ci-trash/ledger.db
          rm -rf target/ci-trash
          mkdir -p target/ci-trash
          cargo run -p rradar-cli --locked -- process fixtures/text/familymart_89.txt --confirm --quiet --db "$DB"
          ID=$(cargo run -p rradar-cli --locked -- last --db "$DB" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          cargo run -p rradar-cli --locked -- delete "$ID" --yes --db "$DB"
          # Prefer repo-local paths over /tmp (Windows native tools cannot read MSYS /tmp).
          cargo run -p rradar-cli --locked -- trash --db "$DB" | tee target/ci-trash/trash.out
          cargo run -p rradar-cli --locked -- restore "$ID" --db "$DB"
          cargo run -p rradar-cli --locked -- count --db "$DB" | tee target/ci-trash/count.out
          grep -E '1 active|active \| 0 trash|active' target/ci-trash/count.out
          cargo run -p rradar-cli --locked -- doctor

      - name: demo closed-loop
        run: cargo run -p rradar-cli --locked -- demo --fixtures fixtures --db target/ci-demo/ledger.db --quiet

      - name: local API smoke
        run: cargo run -p rradar-cli --locked -- api-smoke --fixtures fixtures --db target/ci-api-smoke/ledger.db

      - name: release-check preflight
        run: cargo run -p rradar-cli --locked -- release-check --fixtures fixtures --quiet

      - name: guard release smoke against Windows /tmp path trap
        # Regression for v0.1.0-cli.32/.33: Git Bash /tmp is not readable by native Windows python.
        # Logic lives in scripts/guard-windows-tmp-path-trap.sh so the CI step does not
        # false-positive on its own diagnostic /tmp strings (docs/comments remain allowed).
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/guard-windows-tmp-path-trap.sh --self-test
          bash scripts/guard-windows-tmp-path-trap.sh

      - name: release binary smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p rradar-cli --locked
          if [[ -f target/release/rradar.exe ]]; then B=target/release/rradar.exe; else B=target/release/rradar; fi
          # Must use scripts/smoke-release-binary.sh (stdin JSON to python; no /tmp).
          bash scripts/smoke-release-binary.sh "$B"
          "$B" demo --fixtures fixtures --db target/ci-release-demo/ledger.db --quiet

      - name: network audit
        run: python tools/network-audit/check_offline_deps.py

      - name: supply-chain license gate (python)
        run: python tools/supply-chain/check_deps.py --quiet

      - name: supply-chain cargo-deny dual gate
        # cargo-deny >= 0.20 required for advisory DB CVSS 4.0 parse
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check

      - name: fixtures matrix verify
        run: cargo run -p rradar-cli --locked -- fixtures verify --fixtures fixtures

      - name: licenses CLI surface
        run: cargo run -p rradar-cli --locked -- licenses --json
