name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rradar-x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact: rradar-x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: rradar-x86_64-apple-darwin
          - os: macos-14
            artifact: rradar-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI
        run: cargo build --release -p rradar-cli --locked

      - name: Smoke binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f target/release/rradar.exe ]]; then B=target/release/rradar.exe; else B=target/release/rradar; fi
          # Portable smoke: works on Windows GHA (python not python3; no /tmp assumption)
          bash scripts/smoke-release-binary.sh "$B"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${{ matrix.artifact }}"
          B=target/release/rradar
          mkdir -p "$STAGE"
          cp "$B" "$STAGE/rradar"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          cp THIRD_PARTY_NOTICES "$STAGE/" 2>/dev/null || true
          cp CHANGELOG.md "$STAGE/" 2>/dev/null || true
          cp docs/INSTALL.md "$STAGE/" 2>/dev/null || true
          cp docs/cli.md "$STAGE/" 2>/dev/null || true
          cp docs/privacy.md "$STAGE/" 2>/dev/null || true
          cp docs/ledger-schema.md "$STAGE/" 2>/dev/null || true
          cp docs/RELEASE.md "$STAGE/" 2>/dev/null || true
          # VERSION + version.json from binary (never hardcode schema)
          "$B" version --json > "$STAGE/version.json"
          python3 scripts/write-release-version.py \
            --stage "$STAGE" \
            --tag "${{ github.ref_name }}" \
            --version-json "$STAGE/version.json"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" | tee "${STAGE}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "${{ matrix.artifact }}"
          $B = "target/release/rradar.exe"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $B "$stage/rradar.exe"
          Copy-Item LICENSE "$stage/"
          Copy-Item README.md "$stage/"
          if (Test-Path THIRD_PARTY_NOTICES) { Copy-Item THIRD_PARTY_NOTICES "$stage/" }
          if (Test-Path CHANGELOG.md) { Copy-Item CHANGELOG.md "$stage/" }
          if (Test-Path docs/INSTALL.md) { Copy-Item docs/INSTALL.md "$stage/" }
          if (Test-Path docs/cli.md) { Copy-Item docs/cli.md "$stage/" }
          if (Test-Path docs/privacy.md) { Copy-Item docs/privacy.md "$stage/" }
          if (Test-Path docs/ledger-schema.md) { Copy-Item docs/ledger-schema.md "$stage/" }
          if (Test-Path docs/RELEASE.md) { Copy-Item docs/RELEASE.md "$stage/" }
          $jsonPath = Join-Path $stage "version.json"
          & $B version --json | Out-File -FilePath $jsonPath -Encoding utf8
          python scripts/write-release-version.py --stage $stage --tag "${{ github.ref_name }}" --version-json $jsonPath
          Get-Content (Join-Path $stage "VERSION")
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$stage.sha256" -Value "$hash  $stage.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Flatten artifacts + combined checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp -v {} release-out/ \;
          cd release-out
          ls -la
          cat ./*.sha256 > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-out/*
          generate_release_notes: true
          body: |
            ## ReceiptRadar CLI

            Local-first receipt → ledger. **No cloud. No account.**

            ### Highlights

            - Ledger **schema v4** soft-delete (`trash` / `restore` / `purge`)
            - `rradar release-check` gates process, soft-delete, integrity, demo, api-smoke
            - Archive ships `version.json` + `VERSION` derived from the binary (no hardcoded schema)

            ### Install

            See [docs/INSTALL.md](https://github.com/taipei49314/receiptradar/blob/master/docs/INSTALL.md).

            ```bash
            # verify download
            sha256sum -c rradar-*.sha256
            # after unpack:
            ./rradar version --long
            ./rradar release-check --fixtures /path/to/repo/fixtures
            ```

            Archive includes: binary, LICENSE, README, INSTALL, cli.md, privacy.md, ledger-schema.md, RELEASE.md, CHANGELOG, THIRD_PARTY_NOTICES, VERSION, version.json.

            ### Smoke

            ```bash
            ./rradar version --long
            ./rradar engines
            ./rradar release-check --fixtures fixtures
            ./rradar doctor
            ```

            ONNX weights are **not** bundled; optional `--features onnx` build + `tools/fetch-models.*`.
