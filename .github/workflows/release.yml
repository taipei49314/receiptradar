name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rradar-x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact: rradar-x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: rradar-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI
        run: cargo build --release -p rradar-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/release/rradar "${{ matrix.artifact }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/rradar.exe "${{ matrix.artifact }}.exe"
          Compress-Archive -Path "${{ matrix.artifact }}.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.artifact }}.zip" } |
            Set-Content "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
            ${{ matrix.artifact }}

  # Tag push: attach artifacts to GitHub Release (requires permissions.contents write)
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
