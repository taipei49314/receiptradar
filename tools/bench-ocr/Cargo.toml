[package]
name = "bench-ocr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "bench-ocr"
path = "src/main.rs"

[features]
default = []
onnx = ["rradar-ocr/onnx"]

[dependencies]
rradar-core = { path = "../../crates/rradar-core" }
rradar-ocr = { path = "../../crates/rradar-ocr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
