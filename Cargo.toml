[workspace]
resolver = "2"
members = [
    "crates/rradar-core",
    "crates/rradar-cli",
    "crates/rradar-ocr",
    "crates/rradar-ffi",
    "tools/bench-ocr",
]
default-members = [
    "crates/rradar-core",
    "crates/rradar-cli",
    "crates/rradar-ocr",
    "crates/rradar-ffi",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/receiptradar/receiptradar"
rust-version = "1.78"
authors = ["ReceiptRadar Contributors"]

[workspace.dependencies]
rradar-core = { path = "crates/rradar-core" }
rradar-ocr = { path = "crates/rradar-ocr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ulid = { version = "1", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
